name: engine tick
# GitHub throttles "*/5" schedules to a few runs per day, so each run stays alive for ~5h50m
# and pings the engine every minute itself. Overlapping runs queue (never run in parallel),
# so coverage is effectively continuous.
on:
  # Manual only: the engine is triggered every minute by cron-job.org. Running two triggers made
  # overlapping runs that each asked Zoho for tokens. Start this by hand only as an emergency backup.
  workflow_dispatch:
concurrency:
  group: engine-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Ping engine every minute
        run: |
          end=$(( $(date +%s) + 349*60 ))
          while [ $(date +%s) -lt $end ]; do
            curl -sS -m 55 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.APP_URL }}/api/cron" || echo "ping failed"
            echo
            sleep 60
          done
